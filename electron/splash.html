<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>ServisPro Başlatılıyor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      border: 1px solid rgba(59, 130, 246, 0.25);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(59, 130, 246, 0.15);
      position: relative;
    }

    /* Arka Plan Işık Efekti */
    .glow-bg {
      position: absolute;
      top: -30%;
      left: 20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(14, 165, 233, 0.05) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 85%;
      text-align: center;
    }

    /* Logo Konteyneri */
    .logo-box {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(59, 130, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3);
      margin-bottom: 18px;
      position: relative;
    }

    .logo-box svg {
      width: 42px;
      height: 42px;
      color: #38bdf8;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.6));
      animation: logoPulse 2.5s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.8)); }
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* İlerleme Çubuğu Alanı */
    .progress-wrapper {
      width: 100%;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar {
      height: 6px;
      width: 25%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981);
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.7);
      transition: width 0.3s ease;
    }

    .progress-bar.indeterminate {
      width: 40%;
      animation: indeterminateMove 1.8s infinite ease-in-out;
    }

    @keyframes indeterminateMove {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(180%); }
      100% { transform: translateX(300%); }
    }

    /* Durum Metni */
    .status-text {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .status-text.highlight {
      color: #38bdf8;
      font-weight: 600;
    }

    .status-text.success {
      color: #10b981;
      font-weight: 600;
    }

    /* Alt Bilgi */
    .footer {
      position: absolute;
      bottom: 14px;
      font-size: 10px;
      color: #475569;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 700;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  
  <div class="content">
    <div class="logo-box">
      <!-- Wrench & Shield SVG Icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
      </svg>
    </div>

    <h1 class="title">ServisPro</h1>
    <div class="subtitle">Teknik Servis & Saha Yönetimi</div>

    <div class="progress-wrapper">
      <div id="progressBar" class="progress-bar indeterminate"></div>
    </div>

    <div id="statusText" class="status-text">
      Sistem ve güncellemeler denetleniyor...
    </div>
  </div>

  <div class="footer">
    <span>İzmirim Teknik</span>
    <span>•</span>
    <span id="versionBadge" class="badge">v1.0.0</span>
  </div>

  <script>
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const versionBadge = document.getElementById('versionBadge');

    if (window.splashAPI) {
      window.splashAPI.onStatus((data) => {
        if (!data) return;
        if (data.version) {
          versionBadge.textContent = 'v' + data.version;
        }
        if (data.message) {
          statusText.textContent = data.message;
        }
        if (data.type === 'highlight') {
          statusText.className = 'status-text highlight';
        } else if (data.type === 'success') {
          statusText.className = 'status-text success';
        } else {
          statusText.className = 'status-text';
        }

        if (typeof data.progress === 'number') {
          progressBar.classList.remove('indeterminate');
          progressBar.style.width = data.progress + '%';
        }
      });

      window.splashAPI.onProgress((data) => {
        if (!data) return;
        progressBar.classList.remove('indeterminate');
        progressBar.style.width = (data.percent || 0) + '%';
        if (data.message) {
          statusText.textContent = data.message;
          statusText.className = 'status-text highlight';
        }
      });
    }
  </script>
</body>
</html>
